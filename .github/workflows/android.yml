name: Build Wear OS APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare release files
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/SnapPenaltyWear-0.1.0-debug.apk
          sha256sum release/SnapPenaltyWear-0.1.0-debug.apk > release/SnapPenaltyWear-0.1.0-debug.apk.sha256
          zip -qr release/SnapPenaltyWear-0.1.0-source.zip . \
            -x '.git/*' 'release/*' '*/build/*' '.gradle/*'
          sha256sum release/SnapPenaltyWear-0.1.0-source.zip > release/SnapPenaltyWear-0.1.0-source.zip.sha256

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: SnapPenaltyWear-0.1.0
          path: release/*
          if-no-files-found: error

plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bwa3d.snappenalty'
    compileSdk 36

    defaultConfig {
        applicationId 'com.bwa3d.snappenalty.safe'
        minSdk 30
        targetSdk 35
        versionCode 4
        versionName '0.4.0-safe'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
